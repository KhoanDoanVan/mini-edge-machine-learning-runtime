[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-edge-runtime"
version = "0.1.0"
description = "A dependency-free learning implementation of an ONNX-style model format and edge runtime"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["python"]

